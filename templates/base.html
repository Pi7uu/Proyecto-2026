<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}LUMINA SILVER | Joyería de Plata 925{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#1a1c1c",
                    "surface-bright": "#f9f9f9",
                    "primary-fixed": "#e2e2e2",
                    "surface-container-low": "#f3f3f4",
                    "primary": "#5d5f5f",
                    "tertiary-fixed-dim": "#bccbb7",
                    "on-secondary-fixed-variant": "#474747",
                    "on-secondary-container": "#656464",
                    "surface-container-high": "#e8e8e8",
                    "outline-variant": "#c4c7c8",
                    "tertiary": "#556251",
                    "on-secondary-fixed": "#1b1c1c",
                    "tertiary-fixed": "#d8e7d2",
                    "on-tertiary-fixed": "#131e12",
                    "on-tertiary-container": "#5a6857",
                    "on-surface-variant": "#444748",
                    "surface-tint": "#5d5f5f",
                    "inverse-surface": "#2f3131",
                    "on-primary-container": "#636465",
                    "on-tertiary-fixed-variant": "#3d4a3b",
                    "inverse-primary": "#c6c6c6",
                    "on-surface": "#1a1c1c",
                    "outline": "#747878",
                    "background": "#f9f9f9",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#454747",
                    "on-error-container": "#93000a",
                    "surface": "#f9f9f9",
                    "surface-container-highest": "#e2e2e2",
                    "secondary-container": "#e4e2e1",
                    "primary-fixed-dim": "#c6c6c6",
                    "secondary-fixed-dim": "#c8c6c6",
                    "tertiary-container": "#d8e6d1",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#1a1c1c",
                    "surface-container": "#eeeeee",
                    "inverse-on-surface": "#f0f1f1",
                    "on-secondary": "#ffffff",
                    "primary-container": "#e2e2e2",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-dim": "#dadada",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e2e2e2",
                    "secondary-fixed": "#e4e2e1",
                    "secondary": "#5f5e5e",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "section-gap": "120px",
                    "unit": "8px",
                    "gutter": "24px",
                    "container-max": "1280px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Playfair Display"],
                    "display-lg": ["Playfair Display"],
                    "headline-lg": ["Playfair Display"],
                    "body-lg": ["DM Sans"],
                    "body-md": ["DM Sans"],
                    "headline-md": ["Playfair Display"],
                    "label-sm": ["DM Sans"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                    "headline-lg": ["40px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md": ["28px", {"lineHeight": "1.3", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.1em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            -webkit-font-smoothing: antialiased;
        }
        .glass-nav {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .jewelry-card:hover .quick-add {
            opacity: 1;
            transform: translateY(0);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .line-divider {
            height: 0.5px;
            background-color: #E2E2E2;
            width: 80%;
            margin: 0 auto;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .product-image-zoom { transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .product-image-zoom:hover { transform: scale(1.05); }
    </style>
{% block extra_head %}{% endblock %}
</head>
<body class="font-body-md text-body-md selection:bg-primary-fixed selection:text-on-surface">
{% include "partials/navbar.html" %}
<main class="pt-20">
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<script>
        document.querySelectorAll('.jewelry-card').forEach(card => {
            card.addEventListener('mouseenter', () => {});
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    window.scrollTo({
                        top: target.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });

        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.classList.add('shadow-sm');
                nav.classList.add('bg-surface/95');
            } else {
                nav.classList.remove('shadow-sm');
                nav.classList.remove('bg-surface/95');
            }
        });
    </script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
